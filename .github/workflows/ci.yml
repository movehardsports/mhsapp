name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes its older run pointless; a running run on dev or main
  # isn't cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The pre-commit hook only formats staged files, so check the whole tree here.
      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Browsers are cached per Playwright version; their system libraries are installed on
      # every run, since they live outside the cache.
      - name: Get the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Name the browsers too: installing another one later needs a fresh cache.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # The e2e tests sign up for real, so they need Auth, the database and Mailpit. Skip the
      # services they don't use to start faster.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Point the app at local Supabase
        run: |
          npx supabase status -o env \
            | sed -nE 's/^API_URL=(.*)/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY=(.*)/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      # Playwright builds the app and starts it before running the tests (see playwright.config.ts).
      - name: Build and run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
