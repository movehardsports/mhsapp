name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The e2e tests sign up for real, so they need Auth, the database and Mailpit. Skip the
      # services they don't use to start faster.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Point the app at local Supabase
        run: |
          npx supabase status -o env \
            | sed -nE 's/^API_URL=(.*)/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY=(.*)/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      # Playwright builds the app and starts it before running the tests (see playwright.config.ts).
      - name: Build and run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
